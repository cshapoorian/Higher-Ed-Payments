# Render Blueprint for the storefront API (apps/api). Deploy with "New +" →
# "Blueprint" in the Render dashboard, pointed at this repo.
#
# The web SPA (apps/web) does NOT deploy from this file — it goes to Netlify
# separately; see netlify.toml at the repo root.
#
# DELIBERATE TRADEOFF: this runs on Render's Free plan, which cannot attach
# a persistent disk. apps/api uses SQLite via Prisma, so every idle→wake
# cycle (Free services spin down after 15 minutes idle) or redeploy starts
# from an EMPTY database — every student/order/payment recorded so far is
# wiped. Fine for a demo/take-home reviewer to click through fresh each
# time; not fine for anything meant to persist data. To keep data, either
# move to the "starter" plan and add a disk (zero code change — mount
# something like /data and point DATABASE_URL at file:/data/dev.db), or
# migrate to Render's managed Postgres (has its own free tier, but it
# expires 30 days after creation).
#
# Because of the wipe above, startCommand reseeds (course sections, a demo
# student/term) on every boot, not just first deploy — otherwise the
# storefront has nothing to show after every idle→wake. prisma/seed.ts
# no-ops if data already exists, so this is safe on a warm restart too.
services:
  - name: juspay-takehome-api
    type: web
    runtime: node
    plan: free
    buildCommand: >-
      npm ci &&
      npm run build --workspace packages/shared &&
      npm run prisma:generate --workspace apps/api &&
      npm run build --workspace apps/api
    startCommand: >-
      npm run prisma:deploy --workspace apps/api &&
      npm run --workspace apps/api seed &&
      node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      # Ephemeral — lives on the service's own filesystem, wiped on every
      # idle→wake or redeploy. See the note above; this is the free-tier
      # tradeoff, not a bug.
      - key: DATABASE_URL
        value: file:./dev.db
      # Set this once you know your Netlify site's URL(s) — comma-separated,
      # no trailing slash, e.g. https://your-site.netlify.app. Until this is
      # set correctly the web app's API calls will be blocked by CORS. To
      # also allow that site's Netlify deploy-preview/branch subdomains, add
      # "*--your-site.netlify.app" (suffix match, not literal exact-match).
      - key: CORS_ORIGIN
        sync: false
      - key: HYPERSWITCH_BASE_URL
        value: https://sandbox.hyperswitch.io
      - key: HYPERSWITCH_SECRET_KEY
        sync: false
      - key: HYPERSWITCH_PUBLISHABLE_KEY
        sync: false
      # Dashboard: Settings -> the merchant_id shown there. Not a secret;
      # used only by GET /api/payment-capabilities to report ACH
      # availability accurately. Leave unset and it falls back to "unknown".
      - key: HYPERSWITCH_MERCHANT_ID
        sync: false
      # Dashboard: Developer -> Payment Settings -> Webhooks -> "Payment
      # response hash key". Also this is where you register this service's
      # public URL + /api/webhooks/hyperswitch once you know it.
      - key: HYPERSWITCH_PAYMENT_RESPONSE_HASH_KEY
        sync: false
      # Only needed if you wire up a scheduler for
      # POST /api/installments/run-due — see ENDPOINTS.md. Render can
      # generate this for you; whatever calls that endpoint needs the same
      # value in its own x-cron-secret header.
      - key: CRON_SECRET
        generateValue: true
